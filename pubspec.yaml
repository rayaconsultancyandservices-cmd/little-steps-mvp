name: little_steps_mvp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  cloud_firestore: ^7.2.0
  firebase_auth: ^7.1.0
  # Teacher: real photos + circular attachments upload.
  # `any` वापरलंय म्हणजे firebase_core ^5 शी जुळणारी version आपोआप निवडली जाते.
  # नंतर `flutter pub add firebase_storage` चालवलंत तर ती exact version पिन होते.
  firebase_storage: any
  image_picker: ^1.1.2          # Teacher: Camera / Gallery photos
  file_picker: ^10.3.0          # Teacher: circular PDF / image attachment
  shared_preferences: ^2.3.2   # Parent: remember-me, notification read, favourites, diary ticks
  url_launcher: ^6.3.1         # Parent: phone call + circular attachment open

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#DDF3EE"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/teacher_logo.png
    - assets/images/smart_school_splash_books.png
    - assets/images/parent_splash_pencil.png
    - assets/images/parent_icon.png